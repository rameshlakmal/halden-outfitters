<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halden Outfitters</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/pages/product.js"></script>
</head>
<body>
<main class="wrap">
  <div data-product>
    <div class="pdp" aria-hidden="true">
      <div class="skeleton media" style="aspect-ratio:1;border-radius:16px"></div>
      <div style="display:grid;gap:16px;align-content:start">
        <div class="skeleton line" style="width:30%"></div>
        <div class="skeleton line" style="height:36px;width:80%"></div>
        <div class="skeleton line" style="width:25%;height:24px"></div>
        <div class="skeleton line" style="height:60px"></div>
      </div>
    </div>
  </div>
  <section class="section" data-related-section hidden>
    <div class="section-head"><h2>Goes well with</h2></div>
    <div class="product-grid" data-related></div>
  </section>
</main>
</body>
</html>
