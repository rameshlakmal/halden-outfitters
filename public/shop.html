<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop all gear · Halden Outfitters</title>
  <meta name="description" content="Tents, sleeping bags, camp kitchens and packs.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/pages/shop.js"></script>
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span data-crumb>Shop</span></nav>
    <h1 data-title>Shop all gear</h1>
    <p class="lead" data-blurb>Everything we carry, tested on long trips.</p>
  </div>

  <div class="toolbar">
    <div class="pills" role="group" aria-label="Category" data-pills></div>
    <label class="search">
      <span class="sr-only">Search products</span>
      <svg class="i" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
      <input class="input" type="search" id="search" placeholder="Search tents, stoves, packs" autocomplete="off">
    </label>
    <label>
      <span class="sr-only">Sort by</span>
      <select class="select" data-sort>
        <option value="featured">Featured</option>
        <option value="price-asc">Price, low to high</option>
        <option value="price-desc">Price, high to low</option>
        <option value="newest">Newest</option>
      </select>
    </label>
  </div>

  <p class="muted small" data-count aria-live="polite"></p>
  <div class="product-grid" data-grid style="margin-top:16px"></div>
</main>
</body>
</html>
