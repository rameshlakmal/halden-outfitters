<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your order · Halden Outfitters</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/pages/order.js"></script>
</head>
<body>
<main class="wrap" data-order>
  <div class="two-col" aria-hidden="true" style="padding-top:48px">
    <div class="skeleton line" style="height:380px;border-radius:16px"></div>
    <div class="skeleton line" style="height:300px;border-radius:16px"></div>
  </div>
</main>
<dialog data-confirm aria-labelledby="confirm-title">
  <h2 id="confirm-title" style="font-size:1.25rem">Cancel this order?</h2>
  <p class="muted" style="margin-top:10px">You’ll be refunded in full and the items go back on the shelf. This can’t be undone.</p>
  <div class="actions">
    <button class="btn btn-secondary" type="button" value="keep" data-keep>Keep order</button>
    <button class="btn btn-danger" type="button" data-cancel-confirm>Cancel order</button>
  </div>
</dialog>
</body>
</html>
