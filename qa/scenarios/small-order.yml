# 1 x 28.00, under 75.00 so it pays 7.95 shipping; tax 2.24 (goods only), total 38.19. Password: see README.md.
name: Small order
description: "A confirmed order that paid domestic standard shipping. For shipping and tax display tests."
tags: [orders, shipping, tax]

seed:
  products:
    $as: lantern
    slug: test-lantern-{{unique}}
    sku: HO-T{{run}}A
    category_id: 3
    name: Test Mug {{run}}
    summary: A test product made by Propmaster.
    description: Seeded for a test. Remove it with propmaster clean.
    price: 28.00
    inventory:
      on_hand: 10

  customers:
    email: small-{{unique}}@test.halden.dev
    name: Small Order Shopper
    password_hash: "$argon2id$v=19$m=19456,t=2,p=1$c2dDkHwpLcQfBQATIka2Zg$FWri3HdXgEPvAjUsEAL36I269D0IQZc5cR7pUTOvtG0"
    role: customer
    email_verified_at: yesterday
    orders:
      $as: order
      email: small-{{unique}}@test.halden.dev
      status: confirmed
      subtotal: 28.00
      discount: 0
      shipping: 7.95
      tax: 2.24
      total: 38.19
      tax_rate: 8.00
      shipping_zone: domestic
      shipping_method: standard
      ship_name: Small Order Shopper
      ship_line1: 12 Birch Lane
      ship_city: Portland
      ship_region: OR
      ship_postcode: "97201"
      ship_country: US
      placed_at: yesterday
      confirmed_at: yesterday
      updated_at: yesterday
      order_items:
        $as: order_line
        product_id: { $ref: lantern }
        sku: HO-T{{run}}A
        name: Test product {{run}}
        image: /images/products/headlamp-400.jpg
        category_id: 4
        unit_price: 28.00
        qty: 1
        line_total: 28.00
        discount_alloc: 0
        tax_alloc: 2.24
        returnable: true
      stock_reservations:
        product_id: { $ref: lantern }
        qty: 1
        created_at: yesterday
      payments:
        intent_id: pi_seed_{{unique}}
        status: authorized
        amount: 38.19
        card_brand: visa
        card_last4: "4242"
        created_at: yesterday
        updated_at: yesterday
      order_events:
        to_status: confirmed
        note: Seeded by Propmaster
        created_at: yesterday

  stock_movements:
    - product_id: { $ref: lantern }
      change: 10
      reason: initial
      note: Opening stock
