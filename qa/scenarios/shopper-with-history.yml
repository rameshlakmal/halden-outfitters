# One delivered order and one confirmed order, each 1 x 80.00 (free shipping, tax 6.40, total 86.40). Password: see README.md.
name: Shopper with history
description: "A returning shopper with a delivered order (80 pending points) and one on the way. For order list and detail tests."
tags: [customers, orders, returning]

seed:
  products:
    $as: lantern
    slug: test-lantern-{{unique}}
    sku: HO-T{{run}}A
    category_id: 4
    name: Test Pack {{run}}
    summary: A test product made by Propmaster.
    description: Seeded for a test. Remove it with propmaster clean.
    price: 80.00
    inventory:
      on_hand: 9

  customers:
    email: history-{{unique}}@test.halden.dev
    name: History Shopper
    password_hash: "$argon2id$v=19$m=19456,t=2,p=1$c2dDkHwpLcQfBQATIka2Zg$FWri3HdXgEPvAjUsEAL36I269D0IQZc5cR7pUTOvtG0"
    role: customer
    email_verified_at: yesterday
    orders:
      - $as: first
        email: history-{{unique}}@test.halden.dev
        status: delivered
        subtotal: 80.00
        discount: 0
        shipping: 0
        tax: 6.40
        total: 86.40
        tax_rate: 8.00
        shipping_zone: domestic
        shipping_method: standard
        ship_name: History Shopper
        ship_line1: 12 Birch Lane
        ship_city: Portland
        ship_region: OR
        ship_postcode: "97201"
        ship_country: US
        placed_at: yesterday
        confirmed_at: yesterday
        updated_at: yesterday
        packed_at: yesterday
        shipped_at: yesterday
        tracking_number: HX{{run}}
        delivered_at: yesterday
        points_earned: 80
        order_items:
          $as: first_line
          product_id: { $ref: lantern }
          sku: HO-T{{run}}A
          name: Test product {{run}}
          image: /images/products/headlamp-400.jpg
          category_id: 4
          unit_price: 80.00
          qty: 1
          line_total: 80.00
          discount_alloc: 0
          tax_alloc: 6.40
          returnable: true
          points_earned: 80
        stock_reservations:
          product_id: { $ref: lantern }
          qty: 1
          created_at: yesterday
          consumed_at: yesterday
        payments:
          intent_id: pi_seed_{{unique}}
          status: captured
          amount: 86.40
          amount_captured: 86.40
          card_brand: visa
          card_last4: "4242"
          created_at: yesterday
          updated_at: yesterday
        order_events:
          to_status: delivered
          note: Seeded by Propmaster
          created_at: yesterday
        loyalty_ledger:
          bucket: pending
          kind: earn_pending
          points: 80
          created_at: yesterday
      - $as: second
        email: history-{{unique}}@test.halden.dev
        status: confirmed
        subtotal: 80.00
        discount: 0
        shipping: 0
        tax: 6.40
        total: 86.40
        tax_rate: 8.00
        shipping_zone: domestic
        shipping_method: standard
        ship_name: History Shopper
        ship_line1: 12 Birch Lane
        ship_city: Portland
        ship_region: OR
        ship_postcode: "97201"
        ship_country: US
