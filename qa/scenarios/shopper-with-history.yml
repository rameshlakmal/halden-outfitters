# A returning shopper with a delivered order and a paid one. Password: Halden-Test-1
#   Order 1: 2 x 40.00 = 80.00, free shipping, tax 6.40 = 86.40 (delivered)
#   Order 2: 1 x 40.00 = 40.00, shipping 7.95, tax 3.20 = 51.15 (paid)
name: Shopper with order history
description: Two orders, one delivered and one paid, for My orders, order detail and reorder tests.
tags: [customers, orders, returning]

seed:
  products:
    $as: lantern
    slug: test-lantern-{{unique}}
    category_id: 1
    name: Test Lantern {{run}}
    summary: A test product made by Propmaster.
    description: Seeded for a test. Remove it with propmaster clean.
    price: 40.00
    image: /images/products/headlamp-400.jpg
    inventory:
      stock: 7                   # 10 in, 3 sold
    stock_movements:
      change: 10
      reason: initial

  customers:
    email: returning-{{unique}}@test.halden.dev
    name: Returning Shopper
    password_hash: scrypt$s+Uyg7ypWuOuZyIuO0aywA==$EM7ORT/kuhjAVsOWApPfnYNBh4LjWy+gBtWZ4xVPoR0=
    orders:
      - $as: first
        status: delivered
        subtotal: 80.00
        discount: 0
        shipping: 0
        tax: 6.40
        total: 86.40
        ship_name: Returning Shopper
        ship_line1: 5 Moss Way
        ship_city: Trondheim
        ship_postcode: "7010"
        ship_country: Norway
        order_items:
          product_id: { $ref: lantern }
          name: Test Lantern {{run}}
          unit_price: 40.00
          qty: 2
          line_total: 80.00
        payments:
          amount: 86.40
          card_last4: "4242"
        order_events:
          - status: paid
          - status: shipped
          - status: delivered
      - $as: second
        subtotal: 40.00
        discount: 0
        shipping: 7.95
        tax: 3.20
        total: 51.15
        ship_name: Returning Shopper
        ship_line1: 5 Moss Way
        ship_city: Trondheim
        ship_postcode: "7010"
        ship_country: Norway
        order_items:
          product_id: { $ref: lantern }
          name: Test Lantern {{run}}
          unit_price: 40.00
          qty: 1
          line_total: 40.00
        payments:
          amount: 51.15
          card_last4: "4242"
        order_events:
          status: paid

  stock_movements:
    - product_id: { $ref: lantern }
      order_id: { $ref: first }
      change: -2
      reason: sale
    - product_id: { $ref: lantern }
      order_id: { $ref: second }
      change: -1
      reason: sale
