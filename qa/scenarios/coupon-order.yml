# 2 x 40.00 = 80.00 with its own 10% coupon: 8.00 off, 72.00 is under 75.00 so shipping 7.95, tax 5.76, total 85.71. Password: see README.md.
name: Coupon order
description: "A confirmed order with a 10% discount from a coupon made for it (5 uses, 1 used). For discount display, refund share and cancel tests."
tags: [orders, coupons]

seed:
  coupons:
    $as: coupon
    code: TST{{run}}
    kind: percent
    value: 10
    max_uses: 5
    description: 10% test coupon seeded by Propmaster

  products:
    $as: lantern
    slug: test-lantern-{{unique}}
    sku: HO-T{{run}}A
    category_id: 4
    name: Test Lantern {{run}}
    summary: A test product made by Propmaster.
    description: Seeded for a test. Remove it with propmaster clean.
    price: 40.00
    inventory:
      on_hand: 10

  customers:
    email: coupon-{{unique}}@test.halden.dev
    name: Coupon Shopper
    password_hash: "$argon2id$v=19$m=19456,t=2,p=1$c2dDkHwpLcQfBQATIka2Zg$FWri3HdXgEPvAjUsEAL36I269D0IQZc5cR7pUTOvtG0"
    role: customer
    email_verified_at: yesterday
    orders:
      $as: order
      email: coupon-{{unique}}@test.halden.dev
      status: confirmed
      subtotal: 80.00
      discount: 8.00
      shipping: 7.95
      tax: 5.76
      total: 85.71
      tax_rate: 8.00
      coupon_code: { $ref: coupon }
      shipping_zone: domestic
      shipping_method: standard
      ship_name: Coupon Shopper
      ship_line1: 12 Birch Lane
      ship_city: Portland
      ship_region: OR
      ship_postcode: "97201"
      ship_country: US
      placed_at: yesterday
      confirmed_at: yesterday
      updated_at: yesterday
      order_items:
        $as: order_line
        product_id: { $ref: lantern }
        sku: HO-T{{run}}A
        name: Test product {{run}}
        image: /images/products/headlamp-400.jpg
        category_id: 4
        unit_price: 40.00
        qty: 2
        line_total: 80.00
        discount_alloc: 8.00
        tax_alloc: 5.76
        returnable: true
      stock_reservations:
        product_id: { $ref: lantern }
        qty: 2
        created_at: yesterday
      payments:
        intent_id: pi_seed_{{unique}}
        status: authorized
        amount: 85.71
        card_brand: visa
        card_last4: "4242"
        created_at: yesterday
        updated_at: yesterday
      order_events:
        to_status: confirmed
        note: Seeded by Propmaster
        created_at: yesterday
      coupon_redemptions:
        coupon_code: { $ref: coupon }
        created_at: yesterday

  stock_movements:
    - product_id: { $ref: lantern }
      change: 10
      reason: initial
      note: Opening stock
