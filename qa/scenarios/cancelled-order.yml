# A cancelled order: refunded, and its item back in stock. 1 x 40.00 + 7.95 + 3.20 = 51.15. Password: Halden-Test-1
name: Cancelled order
description: An order that was paid, then cancelled, refunded and returned to stock. For refund and history tests.
tags: [orders, cancel, refund, payments, inventory]

seed:
  products:
    $as: lantern
    slug: test-lantern-{{unique}}
    category_id: 1
    name: Test Lantern {{run}}
    summary: A test product made by Propmaster.
    description: Seeded for a test. Remove it with propmaster clean.
    price: 40.00
    image: /images/products/headlamp-400.jpg
    inventory:
      stock: 10                  # 10 in, 1 sold, 1 returned
    stock_movements:
      change: 10
      reason: initial

  customers:
    email: cancelled-{{unique}}@test.halden.dev
    name: Cancelled Order Shopper
    password_hash: scrypt$s+Uyg7ypWuOuZyIuO0aywA==$EM7ORT/kuhjAVsOWApPfnYNBh4LjWy+gBtWZ4xVPoR0=
    orders:
      $as: order
      status: cancelled
      subtotal: 40.00
      discount: 0
      shipping: 7.95
      tax: 3.20
      total: 51.15
      ship_name: Cancelled Order Shopper
      ship_line1: 8 Fjord Street
      ship_city: Oslo
      ship_postcode: "0150"
      ship_country: Norway
      order_items:
        product_id: { $ref: lantern }
        name: Test Lantern {{run}}
        unit_price: 40.00
        qty: 1
        line_total: 40.00
      payments:
        amount: 51.15
        card_last4: "4242"
        status: refunded
      order_events:
        - status: paid
          note: Seeded by Propmaster
        - status: cancelled
          note: Cancelled by the shopper

  stock_movements:
    - product_id: { $ref: lantern }
      order_id: { $ref: order }
      change: -1
      reason: sale
    - product_id: { $ref: lantern }
      order_id: { $ref: order }
      change: 1
      reason: cancel
