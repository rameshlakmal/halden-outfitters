# Five coupons, one per rule. Codes end in the run id and a letter, e.g. TST42A; the seed output lists them.
name: Test coupons
description: Coupons that work, need a minimum spend, have one use, have ended, or are switched off.
tags: [coupons, checkout]

seed:
  coupons:
    - code: TST{{run}}A
      kind: percent
      value: 15
      description: Works, 15% off
    - code: TST{{run}}B
      kind: fixed
      value: 10
      min_subtotal: 100
      description: 10.00 off orders of 100.00 or more
    - code: TST{{run}}C
      kind: percent
      value: 20
      max_uses: 1
      description: One use only
    - code: TST{{run}}D
      kind: fixed
      value: 5
      starts_at: 2025-12-01T00:00:00Z
      ends_at: 2026-01-01T00:00:00Z
      description: Ended on 1 January 2026
    - code: TST{{run}}E
      kind: percent
      value: 50
      active: false
      description: Switched off
