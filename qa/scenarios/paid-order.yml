description: One order of two Test Lanterns, paid by card. For order pages, cancel, refund and shipping tests.
tags: [orders, payments, cancel, refund]
params:
  status: { type: text, default: paid, description: "paid, shipped or delivered (for cancelled, use cancelled-order)" }

seed:
