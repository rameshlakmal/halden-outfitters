      stock: 8                   # 10 in, 2 sold
    stock_movements:
      change: 10
      reason: initial

  customers:
    email: buyer-{{unique}}@test.halden.dev
    name: Paid Order Shopper
    password_hash: scrypt$s+Uyg7ypWuOuZyIuO0aywA==$EM7ORT/kuhjAVsOWApPfnYNBh4LjWy+gBtWZ4xVPoR0=
    orders:
      $as: order
      status: "{{status}}"
      subtotal: 80.00
      discount: 0
      shipping: 0
      tax: 6.40
      total: 86.40
      ship_name: Paid Order Shopper
      ship_line1: 12 Birch Lane
      ship_city: Bergen
      ship_postcode: "5003"
      ship_country: Norway
      order_items:
        product_id: { $ref: lantern }
        name: Test Lantern {{run}}
        unit_price: 40.00
        qty: 2
        line_total: 80.00
      payments:
        amount: 86.40
        card_last4: "4242"
      order_events:
        status: "{{status}}"
        note: Seeded by Propmaster

  stock_movements:
    product_id: { $ref: lantern }
    order_id: { $ref: order }
    change: -2
    reason: sale
