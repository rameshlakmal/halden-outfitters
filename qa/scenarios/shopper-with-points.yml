    role: customer
    email_verified_at: yesterday
    addresses:
      label: Home
      name: Points Shopper
      line1: 12 Birch Lane
      city: Portland
      region: OR
      postcode: "97201"
      country_code: US
      is_default: true
    loyalty_ledger:
      $via: customer_id
      bucket: available
      kind: adjustment
      points: "{{points}}"
      remaining: "{{points}}"
      expires_at: 2030-12-31T23:59:59Z
