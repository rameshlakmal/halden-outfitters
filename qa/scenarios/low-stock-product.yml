# Only a few left (threshold 5): the page says only N left.
name: Low-stock product
description: "An active product at or under its low-stock threshold."
tags: [products, stock]
params:
  stock: { type: int, default: 2, description: Units on hand (1 to 5) }

seed:
  products:
    $as: item
    slug: test-item-{{unique}}
    sku: HO-T{{run}}A
    category_id: 4
    name: Test Lantern {{run}}
    summary: A test product made by Propmaster.
    description: Seeded for a test. Remove it with propmaster clean.
    price: 40.00
    inventory:
      on_hand: "{{stock}}"

  stock_movements:
    - product_id: { $ref: item }
      change: "{{stock}}"
      reason: initial
      note: Opening stock
