# A product switched off in admin: it must not show in the shop, search or category pages.
name: Hidden product
description: An inactive product with stock, for visibility tests and the admin product list.
tags: [products, admin, negative]

seed:
  products:
    slug: hidden-lantern-{{unique}}
    category_id: 1
    name: Hidden Lantern {{run}}
    summary: A test product that is switched off.
    description: Seeded for a test. Remove it with propmaster clean.
    price: 35.00
    image: /images/products/headlamp-400.jpg
    active: false
    inventory:
      stock: 10
    stock_movements:
      change: 10
      reason: initial
